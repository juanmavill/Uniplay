spring:
  application:
    name: game-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${GAME_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

uniplay:
  game:
    points-per-correct-answer: ${GAME_POINTS_PER_CORRECT_ANSWER:100}
    drawer-majority-bonus: ${GAME_DRAWER_MAJORITY_BONUS:50}
    round-duration: ${GAME_ROUND_DURATION:PT1M}
    session-ttl: ${GAME_SESSION_TTL:PT2H}
