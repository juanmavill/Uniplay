global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: uniplay-edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - edge.uniplay.internal:8080
          - edge.uniplay.internal:8083

  - job_name: uniplay-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - core.uniplay.internal:8081
          - core.uniplay.internal:8082
          - core.uniplay.internal:8084
          - core.uniplay.internal:8085
