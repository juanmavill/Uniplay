name: uniplay

services:
  realtime-service:
    build:
      context: ../realtime-service
    container_name: uniplay-realtime-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REALTIME_SERVICE_PORT: 8083
      REALTIME_ALLOWED_ORIGINS: "*"
    ports:
      - "${REALTIME_SERVICE_PORT:-8083}:8083"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  room-service:
    build:
      context: ../room-service
    container_name: uniplay-room-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROOM_SERVICE_PORT: 8081
    ports:
      - "${ROOM_SERVICE_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: uniplay-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
