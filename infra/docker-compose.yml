name: uniplay

services:
  api-gateway:
    build:
      context: ../api-gateway
    container_name: uniplay-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      API_GATEWAY_PORT: 8080
      ROOM_SERVICE_URI: http://room-service:8081
      GAME_SERVICE_URI: http://game-service:8082
      REALTIME_SERVICE_URI: http://realtime-service:8083
      REALTIME_WEBSOCKET_URI: ws://realtime-service:8083
      METRICS_SERVICE_URI: http://metrics-service:8084
      VOICE_SERVICE_URI: http://voice-service:8085
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-*}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_REQUESTS_PER_WINDOW: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_WINDOW:-120}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-PT1M}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      room-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
    container_name: uniplay-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  game-service:
    build:
      context: ../game-service
    container_name: uniplay-game-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_SERVICE_PORT: 8082
      GAME_POINTS_PER_CORRECT_ANSWER: 100
      GAME_ROUND_DURATION: ${GAME_ROUND_DURATION:-PT1M}
      GAME_SESSION_TTL: PT2H
    ports:
      - "${GAME_SERVICE_PORT:-8082}:8082"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  realtime-service:
    build:
      context: ../realtime-service
    container_name: uniplay-realtime-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REALTIME_SERVICE_PORT: 8083
      REALTIME_ALLOWED_ORIGINS: "*"
    ports:
      - "${REALTIME_SERVICE_PORT:-8083}:8083"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  voice-service:
    build:
      context: ../voice-service
    container_name: uniplay-voice-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VOICE_SERVICE_PORT: 8085
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      VOICE_TOKEN_TTL: ${VOICE_TOKEN_TTL:-PT30M}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${VOICE_SERVICE_PORT:-8085}:8085"
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  metrics-service:
    build:
      context: ../metrics-service
    container_name: uniplay-metrics-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      METRICS_SERVICE_PORT: 8084
    ports:
      - "${METRICS_SERVICE_PORT:-8084}:8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: uniplay-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api-gateway:
        condition: service_healthy
      room-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: uniplay-livekit
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  room-service:
    build:
      context: ../room-service
    container_name: uniplay-room-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROOM_SERVICE_PORT: 8081
    ports:
      - "${ROOM_SERVICE_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: uniplay-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  prometheus-data:
  redis-data:
