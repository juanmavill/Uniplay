server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /salas/ {
        proxy_pass http://api-gateway:8080;
    }

    location = /salas {
        proxy_pass http://api-gateway:8080;
    }

    location /games/ {
        proxy_pass http://api-gateway:8080;
    }

    location /voice/ {
        proxy_pass http://api-gateway:8080;
    }

    location /metrics/ {
        proxy_pass http://api-gateway:8080;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /ws {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
