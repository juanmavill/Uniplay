name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  repo-validation:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required paths
        shell: bash
        run: |
          required_paths=(
            "api-gateway"
            "room-service"
            "game-service"
            "realtime-service"
            "voice-service"
            "metrics-service"
            "frontend"
            "infra"
            "docs/adr/0001-monorepo-con-despliegue-independiente.md"
            "docs/adr/0002-aws-recuperacion-automatica.md"
            "docs/git-workflow.md"
          )

          for path in "${required_paths[@]}"; do
            test -e "$path" || {
              echo "Missing required path: $path"
              exit 1
            }
          done

      - name: Check whitespace
        run: git diff --check

      - name: Validate local infrastructure compose file
        run: docker compose -f infra/docker-compose.yml config

  backend:
    # Cada servicio se compila y prueba por separado, igual que se despliega.
    # Un fallo en uno no enmascara ni bloquea al resto.
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - room-service
          - game-service
          - realtime-service
          - voice-service
          - metrics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
