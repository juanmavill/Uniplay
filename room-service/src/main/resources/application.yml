spring:
  application:
    name: room-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${ROOM_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

uniplay:
  room:
    code-length: ${ROOM_CODE_LENGTH:6}
    max-players: ${ROOM_MAX_PLAYERS:21}
    code-generation-max-attempts: ${ROOM_CODE_GENERATION_MAX_ATTEMPTS:10}
    ttl: ${ROOM_TTL:PT2H}
