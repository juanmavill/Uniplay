spring:
  application:
    name: realtime-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${REALTIME_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

uniplay:
  realtime:
    websocket-endpoint: ${REALTIME_WEBSOCKET_ENDPOINT:/ws}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:*}
