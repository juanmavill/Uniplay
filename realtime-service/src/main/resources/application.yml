spring:
  application:
    name: realtime-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${REALTIME_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

uniplay:
  realtime:
    websocket-endpoint: ${REALTIME_WEBSOCKET_ENDPOINT:/ws}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:*}
